# SPA server behind Traefik. Listens on 8080 (nginx-unprivileged, non-root).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers (SPEC D17). add_header is not inherited into a location
    # that sets its own, so every location includes the same file.
    include /etc/nginx/conf.d/security-headers.inc;

    # Per-request CSP nonce ($request_id, 128 random bits, also used in the CSP
    # header) for the style Radix injects when a dialog locks scrolling. It is
    # exposed to the app through a meta tag in the HTML shell only.
    sub_filter '</head>' '<meta name="csp-nonce" content="$request_id"></head>';
    sub_filter_once on;

    # Behind a proxy nginx only knows its internal host and port. Any redirect
    # it sends must be relative, never http://<container>:8080/...
    absolute_redirect off;
    port_in_redirect off;

    # Hashed build assets: cache forever, and a missing file is a real 404.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app shell must always be revalidated so a deploy is picked up.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths render the app (client-side routing).
    # No `$uri/` on purpose: it would 301 to add a trailing slash.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri /index.html;
    }
}
