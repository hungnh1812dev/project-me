# envsubst template: the Dockerfile copies it to /etc/nginx/templates/, and the nginx
# image renders ${CSP_API_ORIGIN} / ${CSP_IMG_ORIGINS} at start-up. Only defined env vars
# are substituted, so nginx's own variables ($uri) stay intact. The CSP must match
# buildContentSecurityPolicy() in src/core/security/csp.ts (pinned by nginxTemplate.test.ts).
# The security headers are repeated per location: a location with its own add_header
# drops every inherited one. /healthz is exempt.
server {
    listen 80;
    server_name abyssdev;
    root /usr/share/nginx/html;
    index index.html;

    #Health check endpoint for load balancer
    location /healthz {
        access_log off;
        return 200 'OK';
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: ${CSP_API_ORIGIN} ${CSP_IMG_ORIGINS}; font-src 'self'; connect-src 'self' ${CSP_API_ORIGIN}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    # SPA routing: unknown paths fall back to index.html
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: ${CSP_API_ORIGIN} ${CSP_IMG_ORIGINS}; font-src 'self'; connect-src 'self' ${CSP_API_ORIGIN}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
