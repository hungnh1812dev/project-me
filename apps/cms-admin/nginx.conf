# SPA server behind Traefik. Listens on 8080 (nginx-unprivileged, non-root).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers (SPEC D17). add_header is not inherited into a location
    # that sets its own, so every location includes the same file.
    include /etc/nginx/conf.d/security-headers.inc;

    # Health routes (SPEC ADM-12): the resolver and $cms_api_live_url.
    include /etc/nginx/conf.d/health-routes.inc;

    # Per-request CSP nonce ($request_id, 128 random bits, also used in the CSP
    # header) for the style Radix injects when a dialog locks scrolling. It is
    # exposed to the app through a meta tag in the HTML shell only.
    sub_filter '</head>' '<meta name="csp-nonce" content="$request_id"></head>';
    sub_filter_once on;

    # Behind a proxy nginx only knows its internal host and port. Any redirect
    # it sends must be relative, never http://<container>:8080/...
    absolute_redirect off;
    port_in_redirect off;

    # Health routes (SPEC ADM-12), ahead of the SPA fallback; never the app shell.
    # Live: nginx alone. Ready: cms-api's live answer through an auth_request
    # subrequest (2 s timeouts); the upstream body and headers are never passed.
    location ~ ^/health(/live)?/?$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location ~ ^/health/ready/?$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        auth_request /_health/cms-api-live;
        error_page 401 403 500 =503 @health_error;
        try_files /_health/none @health_ok;
    }

    location ~ ^/health/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 404 '{"status":"not-found"}';
    }

    location = /_health/cms-api-live {
        internal;
        proxy_pass $cms_api_live_url;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
    }

    location @health_ok {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location @health_error {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 503 '{"status":"error"}';
    }

    # Hashed build assets: cache forever, and a missing file is a real 404.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app shell must always be revalidated so a deploy is picked up.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths render the app (client-side routing).
    # No `$uri/` on purpose: it would 301 to add a trailing slash.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri /index.html;
    }
}
