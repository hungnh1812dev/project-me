# Docs: docs/ci-cd.md
# Shared publish for one app, called by the publish-<app> jobs of ci.yml (after the app flow passed; e2e does not run in CI):
#   image (per platform: build -> non-root guard -> bundle check (cms-admin) -> push by digest)
#   -> manifest (<branch>-<sha7> and <branch>) -> deploy (bump <app>-sync-overlay.yaml)
# One production image per service, built straight from apps/<app>/Dockerfile.
# cms-api is one image: the init container runs `npm run deploy:migrate`, the main container
# runs `node dist/main.js`; both use the same tag from cms-api-sync-overlay.yaml.
# The caller grants contents: read + packages: write and passes secrets: inherit.
# No workflow-level concurrency here: it would collide with the entrypoint's run-level group.
name: Publish

on:
  workflow_call:
    inputs:
      app:
        description: App to publish (cms-api, cms-admin, web); also the Dockerfile directory
        type: string
        required: true
      environment:
        description: GitHub Environment (staging or production)
        type: string
        required: true
      matrix:
        description: 'JSON {include: [{platform, arch, runner}]}, one image job per platform'
        type: string
        required: true
      tag:
        description: Image tag, <branch>-<sha7>
        type: string
        required: true
      branch:
        description: Source branch, also the moving image tag
        type: string
        required: true
      deploy_ref:
        description: Deployment repo branch to bump
        type: string
        required: true
      image_prefix:
        description: Registry prefix; the image is <image_prefix>/<app>
        type: string
        required: true
      turbo_version:
        description: Turbo version passed to the Dockerfile as a build arg
        type: string
        required: true

permissions:
  contents: read

jobs:
  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build args are GitHub Environment variables (never secrets: they end up in the public
      # bundle), readable only in a job that runs in the Environment, so they are resolved here.
      - name: Resolve build args
        id: args
        env:
          APP: ${{ inputs.app }}
          ENVIRONMENT: ${{ inputs.environment }}
          TURBO_VERSION: ${{ inputs.turbo_version }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_ADMIN_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          single_line() { # name value
            case "$2" in
              *$'\n'* | *$'\r'*) echo "::error::$1 for ${ENVIRONMENT} must be a single line"; exit 1 ;;
            esac
          }
          require() { # name value
            single_line "$1" "$2"
            if [ -z "$2" ]; then echo "::error::$1 is not set for ${ENVIRONMENT}"; exit 1; fi
          }
          if [ "$APP" = cms-admin ]; then
            require VITE_API_BASE_URL "$VITE_API_BASE_URL"
            echo "api_url=${VITE_API_BASE_URL}" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'build_args<<ARGS_EOF'
            echo "TURBO_VERSION=${TURBO_VERSION}"
            case "$APP" in
              cms-api) ;;
              cms-admin)
                echo "VITE_API_BASE_URL=${VITE_API_BASE_URL}" ;;
              web)
                require NEXT_PUBLIC_API_BASE_URL "$NEXT_PUBLIC_API_BASE_URL"
                single_line NEXT_PUBLIC_ADMIN_URL "$NEXT_PUBLIC_ADMIN_URL"
                single_line NEXT_PUBLIC_TURNSTILE_SITE_KEY "$NEXT_PUBLIC_TURNSTILE_SITE_KEY"
                echo "NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}"
                echo "NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL}"
                echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}" ;;
              *) echo "::error::unknown app '$APP'"; exit 1 ;;
            esac
            echo 'ARGS_EOF'
          } >> "$GITHUB_OUTPUT"
      # Load the image locally first so the guards can inspect and run it before anything is pushed
      - name: Build and load
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.args.outputs.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          tags: ${{ inputs.app }}:ci
          cache-from: type=gha,scope=${{ inputs.app }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ inputs.app }}-${{ matrix.arch }},mode=max
      - name: Non-root guard
        env:
          IMAGE: ${{ inputs.app }}:ci
        run: bash .github/scripts/image-user.sh "$IMAGE"
      - name: Bundle smoke check
        if: inputs.app == 'cms-admin'
        env:
          IMAGE: ${{ inputs.app }}:ci
          API_URL: ${{ steps.args.outputs.api_url }}
        run: bash .github/scripts/bundle-check.sh "$IMAGE" "$API_URL"
      # Untagged, pushed by digest; the manifest job tags the per-arch digests together.
      # Same inputs as the loaded build, so every layer comes from the builder cache.
      - name: Push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.args.outputs.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ inputs.image_prefix }}/${{ inputs.app }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.app }}-${{ matrix.arch }}
      - name: Export digest
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ inputs.app }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Tag
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ inputs.app }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create tagged manifest list
        id: merge
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ inputs.image_prefix }}/${{ inputs.app }}
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ inputs.branch }}
        run: |
          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create --tag="${IMAGE}:${TAG}" --tag="${IMAGE}:${BRANCH}" "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: manifest
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One tag bump at a time per environment, across apps; never cancel a half-done bump
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.DEPLOYMENT_REPO }}
          ref: ${{ inputs.deploy_ref }}
          token: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
          # The token is not written to deployment/.git/config; only the push step gets it
          persist-credentials: false
          path: deployment
      - name: Bump APP_IMAGE_TAG
        id: bump
        working-directory: deployment
        env:
          APP: ${{ inputs.app }}
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ inputs.branch }}
          DEPLOY_REF: ${{ inputs.deploy_ref }}
          CLUSTER_PATH: ${{ vars.DEPLOYMENT_CLUSTER_PATH }}
        run: |
          if [ -z "$CLUSTER_PATH" ]; then
            echo "::error::DEPLOYMENT_CLUSTER_PATH is not set for this environment"; exit 1
          fi
          key='^([[:space:]]*APP_IMAGE_TAG:[[:space:]]*)'

          # Validate the file before touching it, so a bad one never leaves a partial bump
          f="$CLUSTER_PATH/${APP}-sync-overlay.yaml"
          if [ ! -f "$f" ]; then
            echo "::error::$f not found in the deployment repo"; exit 1
          elif ! grep -qE "$key" "$f"; then
            echo "::error::APP_IMAGE_TAG not found in $f"; exit 1
          fi

          sed -i -E "s|${key}.*\$|\\1\"${TAG}\"|" "$f"
          if git diff --quiet; then
            echo "::notice::Already at ${TAG}; nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(${BRANCH}): bump ${APP} to ${TAG}"
          git diff HEAD~1 --stat
      - name: Push the bump
        if: steps.bump.outputs.changed == 'true'
        working-directory: deployment
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
        run: |
          # Token only as a per-command header, never stored in the repo config
          auth="$(printf 'x-access-token:%s' "$DEPLOY_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          g() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" "$@"; }

          # Another bump may land between checkout and push: rebase onto it and retry
          for attempt in 1 2 3; do
            if g push origin "HEAD:${DEPLOY_REF}"; then exit 0; fi
            echo "::warning::Push rejected (attempt ${attempt}/3); rebasing and retrying"
            g pull --rebase origin "$DEPLOY_REF"
          done
          echo "::error::Could not push the tag bump after 3 attempts"; exit 1
