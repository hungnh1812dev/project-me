# Docs: docs/ci-cd.md
# Shared publish for one app, called by the per-app flows (cms-api.yml, cms-admin.yml, frontend.yml):
#   image (per platform: build -> non-root guard -> optional bundle smoke check -> push by digest)
#   -> manifest (<branch>-<sha7> and <branch>) -> deploy (bump <app>-sync-overlay.yaml)
# The caller grants contents: read + packages: write and passes secrets: inherit.
# No workflow-level concurrency here: it would collide with the entrypoint's run-level group.
name: Publish

on:
  workflow_call:
    inputs:
      app:
        description: App to publish (cms-api, cms-admin, frontend); also the Dockerfile directory
        type: string
        required: true
      environment:
        description: GitHub Environment (staging or production)
        type: string
        required: true
      matrix:
        description: 'JSON {include: [{platform, arch, runner}]}, one image job per platform'
        type: string
        required: true
      tag:
        description: Image tag, <branch>-<sha7>
        type: string
        required: true
      branch:
        description: Source branch, also the moving image tag
        type: string
        required: true
      deploy_ref:
        description: Deployment repo branch to bump
        type: string
        required: true
      image_prefix:
        description: Registry prefix; the image is <image_prefix>/<app>
        type: string
        required: true
      build_args:
        description: Docker build args, newline-separated KEY=value (never secrets)
        type: string
        required: false
        default: ''
      smoke_check:
        description: Run bundle-check.sh on the built image before the push (cms-admin)
        type: boolean
        required: false
        default: false
      smoke_api_url:
        description: API origin the bundle smoke check expects; empty means the relative /api/v1
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Load the image locally first so the guards can inspect and run it before anything is pushed
      - name: Build and load
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          tags: ${{ inputs.app }}:ci
          cache-from: type=gha,scope=${{ inputs.app }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ inputs.app }}-${{ matrix.arch }},mode=max
      - name: Non-root guard
        env:
          IMAGE: ${{ inputs.app }}:ci
        run: bash .github/scripts/image-user.sh "$IMAGE"
      - name: Bundle smoke check
        if: inputs.smoke_check
        env:
          IMAGE: ${{ inputs.app }}:ci
          API_URL: ${{ inputs.smoke_api_url }}
        run: bash .github/scripts/bundle-check.sh "$IMAGE" "$API_URL"
      # Untagged, pushed by digest; the manifest job tags the per-arch digests together.
      # Same inputs as the loaded build, so every layer comes from the builder cache.
      - name: Push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ inputs.image_prefix }}/${{ inputs.app }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.app }}-${{ matrix.arch }}
      - name: Export digest
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ inputs.app }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Tag
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ inputs.app }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create tagged manifest list
        id: merge
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ inputs.image_prefix }}/${{ inputs.app }}
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ inputs.branch }}
        run: |
          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create --tag="${IMAGE}:${TAG}" --tag="${IMAGE}:${BRANCH}" "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: manifest
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One tag bump at a time per environment, across apps; never cancel a half-done bump
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.DEPLOYMENT_REPO }}
          ref: ${{ inputs.deploy_ref }}
          token: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
          path: deployment
      - name: Bump APP_IMAGE_TAG
        id: bump
        working-directory: deployment
        env:
          APP: ${{ inputs.app }}
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ inputs.branch }}
          DEPLOY_REF: ${{ inputs.deploy_ref }}
          CLUSTER_PATH: ${{ vars.DEPLOYMENT_CLUSTER_PATH }}
        run: |
          if [ -z "$CLUSTER_PATH" ]; then
            echo "::error::DEPLOYMENT_CLUSTER_PATH is not set for this environment"; exit 1
          fi
          key='^([[:space:]]*APP_IMAGE_TAG:[[:space:]]*)'

          # Validate the file before touching it, so a bad one never leaves a partial bump
          f="$CLUSTER_PATH/${APP}-sync-overlay.yaml"
          if [ ! -f "$f" ]; then
            echo "::error::$f not found in the deployment repo"; exit 1
          elif ! grep -qE "$key" "$f"; then
            echo "::error::APP_IMAGE_TAG not found in $f"; exit 1
          fi

          sed -i -E "s|${key}.*\$|\\1\"${TAG}\"|" "$f"
          if git diff --quiet; then
            echo "::notice::Already at ${TAG}; nothing to commit"; exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(${BRANCH}): bump ${APP} to ${TAG}"
          git diff HEAD~1 --stat

          # Another bump may land between checkout and push: rebase onto it and retry
          for attempt in 1 2 3; do
            if git push origin "HEAD:${DEPLOY_REF}"; then exit 0; fi
            echo "::warning::Push rejected (attempt ${attempt}/3); rebasing and retrying"
            git pull --rebase origin "$DEPLOY_REF"
          done
          echo "::error::Could not push the tag bump after 3 attempts"; exit 1
