# Docs: docs/deployments/ci-cd.md
# Entrypoint: changes -> one flow per affected app (cms-api.yml; app-checks.yml for cms-admin and web)
#   Depth per branch (.github/scripts/pipeline-target.sh): develop = checks; staging = checks + build;
#   main = checks + build + an image built and guarded but not pushed. A repo-wide job (format, audit) always runs.
#   e2e does not run in CI (local only: `pnpm smoke`, `pnpm e2e:spec`).
#   A repo tag v<x.y.z> (.github/scripts/release-apps.sh): checks + build + image for the apps whose version changed
#   since the previous release, pushed as <image_prefix>/<app>:<app version>, then the deploy repo main is bumped.
#   publish-<app> (_publish.yml): runs when the event builds images, the app has an image to build and the app
#   flow succeeded; it pushes nothing until should_push_image is true. CI never starts the local smoke stack.
# The app flows never depend on each other, so one app failing never skips another.
name: CI

on:
  push:
    branches: [develop, staging, main]
    # Only the repo tag releases; app tags (<app>@x.y.z) never match
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # pull_request:
  #   branches: [develop, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; never cut a push run mid-way
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Keep in sync with the Dockerfiles and the root package.json (the repo job checks it: pins-check.sh)
  TURBO_VERSION: 2.11.9
  # ghcr.io/<owner>/<repo>/<app>; GHCR needs lowercase names
  IMAGE_PREFIX: ghcr.io/hungnh1812dev/project-me

jobs:
  changes:
    name: Detect affected apps
    runs-on: ubuntu-latest
    outputs:
      cms_api_affected: ${{ steps.affected.outputs.cms_api_affected || steps.release.outputs.cms_api_affected }}
      cms_api_image: ${{ steps.affected.outputs.cms_api_image || steps.release.outputs.cms_api_image }}
      cms_api_version: ${{ steps.release.outputs.cms_api_version }}
      cms_api_matrix: ${{ steps.target.outputs.cms_api_matrix }}
      cms_admin_affected: ${{ steps.affected.outputs.cms_admin_affected || steps.release.outputs.cms_admin_affected }}
      cms_admin_image: ${{ steps.affected.outputs.cms_admin_image || steps.release.outputs.cms_admin_image }}
      cms_admin_version: ${{ steps.release.outputs.cms_admin_version }}
      cms_admin_matrix: ${{ steps.target.outputs.cms_admin_matrix }}
      web_affected: ${{ steps.affected.outputs.web_affected || steps.release.outputs.web_affected }}
      web_image: ${{ steps.affected.outputs.web_image || steps.release.outputs.web_image }}
      web_version: ${{ steps.release.outputs.web_version }}
      web_matrix: ${{ steps.target.outputs.web_matrix }}
      should_build: ${{ steps.target.outputs.should_build }}
      should_build_image: ${{ steps.target.outputs.should_build_image }}
      should_push_image: ${{ steps.target.outputs.should_push_image }}
      environment: ${{ steps.target.outputs.environment }}
      deploy_ref: ${{ steps.target.outputs.deploy_ref }}
      # Workflow-level env does not reach `with:` of a reusable-workflow call; pass it through here
      turbo_version: ${{ steps.target.outputs.turbo_version }}
      image_prefix: ${{ steps.target.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # turbo and the workflow-file routing need the history between base and head
          fetch-depth: 0

      - name: List affected apps
        id: affected
        if: github.ref_type == 'branch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/affected.sh

      - name: List released apps
        id: release
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          TURBO_VERSION: ${{ env.TURBO_VERSION }}
        run: bash .github/scripts/release-apps.sh

      - name: Resolve pipeline target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          CMS_API_IMAGE: ${{ steps.affected.outputs.cms_api_image || steps.release.outputs.cms_api_image }}
          CMS_ADMIN_IMAGE: ${{ steps.affected.outputs.cms_admin_image || steps.release.outputs.cms_admin_image }}
          WEB_IMAGE: ${{ steps.affected.outputs.web_image || steps.release.outputs.web_image }}
          TURBO_VERSION: ${{ env.TURBO_VERSION }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: bash .github/scripts/pipeline-target.sh

  # Repo-wide checks that no single app owns
  repo:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version pins agree
        run: bash .github/scripts/pins-check.sh
      - name: Format
        run: pnpm format:check
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  # Status checks show as "<app> / Checks" and "<app> / Build"
  cms-api:
    name: cms-api
    needs: changes
    if: needs.changes.outputs.cms_api_affected == 'true'
    uses: ./.github/workflows/cms-api.yml
    with:
      turbo_version: ${{ needs.changes.outputs.turbo_version }}
      should_build: ${{ needs.changes.outputs.should_build == 'true' }}

  cms-admin:
    name: cms-admin
    needs: changes
    if: needs.changes.outputs.cms_admin_affected == 'true'
    uses: ./.github/workflows/app-checks.yml
    with:
      app: cms-admin
      turbo_version: ${{ needs.changes.outputs.turbo_version }}
      should_build: ${{ needs.changes.outputs.should_build == 'true' }}

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web_affected == 'true'
    uses: ./.github/workflows/app-checks.yml
    with:
      app: web
      turbo_version: ${{ needs.changes.outputs.turbo_version }}
      should_build: ${{ needs.changes.outputs.should_build == 'true' }}

  publish-cms-api:
    name: publish cms-api
    needs: [changes, cms-api]
    # always(): run even though a sibling app flow failed or was skipped; only this app must be green
    if: >-
      always() && needs.changes.outputs.should_build_image == 'true' && needs.changes.outputs.cms_api_image == 'true'
      && needs.cms-api.result == 'success'
    uses: ./.github/workflows/_publish.yml
    # Called workflow's jobs get at most these; only its image and manifest jobs use packages: write
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      app: cms-api
      environment: ${{ needs.changes.outputs.environment }}
      matrix: ${{ needs.changes.outputs.cms_api_matrix }}
      tag: ${{ needs.changes.outputs.cms_api_version }}
      deploy_ref: ${{ needs.changes.outputs.deploy_ref }}
      should_push: ${{ needs.changes.outputs.should_push_image == 'true' }}
      image_prefix: ${{ needs.changes.outputs.image_prefix }}
      turbo_version: ${{ needs.changes.outputs.turbo_version }}

  publish-cms-admin:
    name: publish cms-admin
    needs: [changes, cms-admin]
    # always(): run even though a sibling app flow failed or was skipped; only this app must be green
    if: >-
      always() && needs.changes.outputs.should_build_image == 'true' && needs.changes.outputs.cms_admin_image == 'true'
      && needs.cms-admin.result == 'success'
    uses: ./.github/workflows/_publish.yml
    # Called workflow's jobs get at most these; only its image and manifest jobs use packages: write
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      app: cms-admin
      environment: ${{ needs.changes.outputs.environment }}
      matrix: ${{ needs.changes.outputs.cms_admin_matrix }}
      tag: ${{ needs.changes.outputs.cms_admin_version }}
      deploy_ref: ${{ needs.changes.outputs.deploy_ref }}
      should_push: ${{ needs.changes.outputs.should_push_image == 'true' }}
      image_prefix: ${{ needs.changes.outputs.image_prefix }}
      turbo_version: ${{ needs.changes.outputs.turbo_version }}

  publish-web:
    name: publish web
    needs: [changes, web]
    # always(): run even though a sibling app flow failed or was skipped; only this app must be green
    if: >-
      always() && needs.changes.outputs.should_build_image == 'true' && needs.changes.outputs.web_image == 'true'
      && needs.web.result == 'success'
    uses: ./.github/workflows/_publish.yml
    # Called workflow's jobs get at most these; only its image and manifest jobs use packages: write
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      app: web
      environment: ${{ needs.changes.outputs.environment }}
      matrix: ${{ needs.changes.outputs.web_matrix }}
      tag: ${{ needs.changes.outputs.web_version }}
      deploy_ref: ${{ needs.changes.outputs.deploy_ref }}
      should_push: ${{ needs.changes.outputs.should_push_image == 'true' }}
      image_prefix: ${{ needs.changes.outputs.image_prefix }}
      turbo_version: ${{ needs.changes.outputs.turbo_version }}
