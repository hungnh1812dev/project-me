# Docs: docs/ci-cd.md
# Entrypoint: changes -> one flow per affected app (cms-api.yml, cms-admin.yml, web.yml)
#   each flow: checks -> build; a repo-wide job (format, audit) always runs.
#   e2e (e2e.yml) runs when any app or the e2e suite changed, on a docker-run stack of the built images.
#   publish-<app> (_publish.yml): image -> manifest -> deploy bump, only on a push to staging/main, only when
#   the app's build inputs changed and both the app flow and e2e succeeded. CI never starts the local smoke stack.
# The app flows never depend on each other, so one app failing never skips another.
name: CI

on:
  push:
    branches: [develop, staging, main]
  # pull_request:
  #   branches: [develop, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; never cut a push run mid-way
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Keep in sync with the Dockerfiles and the root package.json
  TURBO_VERSION: 2.11.9
  # ghcr.io/<owner>/<repo>/<app>; GHCR needs lowercase names
  IMAGE_PREFIX: ghcr.io/hungnh1812dev/project-me

jobs:
  changes:
    name: Detect affected apps
    runs-on: ubuntu-latest
    outputs:
      cms_api_affected: ${{ steps.affected.outputs.cms_api_affected }}
      cms_api_image: ${{ steps.affected.outputs.cms_api_image }}
      cms_api_matrix: ${{ steps.target.outputs.cms_api_matrix }}
      cms_admin_affected: ${{ steps.affected.outputs.cms_admin_affected }}
      cms_admin_image: ${{ steps.affected.outputs.cms_admin_image }}
      cms_admin_matrix: ${{ steps.target.outputs.cms_admin_matrix }}
      web_affected: ${{ steps.affected.outputs.web_affected }}
      web_image: ${{ steps.affected.outputs.web_image }}
      web_matrix: ${{ steps.target.outputs.web_matrix }}
      e2e: ${{ steps.affected.outputs.e2e }}
      publish: ${{ steps.target.outputs.publish }}
      branch: ${{ steps.target.outputs.branch }}
      tag: ${{ steps.target.outputs.tag }}
      environment: ${{ steps.target.outputs.environment }}
      deploy_ref: ${{ steps.target.outputs.deploy_ref }}
      # Workflow-level env does not reach `with:` of a reusable-workflow call; pass it through here
      turbo_version: ${{ steps.target.outputs.turbo_version }}
      image_prefix: ${{ steps.target.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # turbo and the workflow-file routing need the history between base and head
          fetch-depth: 0

      - name: List affected apps
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/affected.sh

      - name: Resolve deploy target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CMS_API_IMAGE: ${{ steps.affected.outputs.cms_api_image }}
          CMS_ADMIN_IMAGE: ${{ steps.affected.outputs.cms_admin_image }}
          WEB_IMAGE: ${{ steps.affected.outputs.web_image }}
        run: |
          # branch -> image platforms, GitHub Environment, deployment repo branch
          # (consumed by the publish-<app> jobs; nothing here assumes these branches exist)
          case "$BRANCH" in
            develop) platforms='[]';              environment='';           deploy_ref='' ;;     # checks + build only
            staging) platforms='["linux/arm64"]'; environment=staging;    deploy_ref=staging ;; # Ubuntu VM on Apple M1
            main)    platforms='["linux/amd64"]'; environment=production; deploy_ref=main ;;    # Ubuntu on Intel
            *) echo "::error::No deploy target for branch '$BRANCH'"; exit 1 ;;
          esac
          publish=false
          if [ "$EVENT_NAME" = push ] && [ -n "$environment" ]; then publish=true; fi
          # One image job per platform, each on a native runner; empty for apps without a new image
          matrix_for() {
            local p='[]'
            if [ "$1" = true ]; then p=$platforms; fi
            jq -cn --argjson platforms "$p" '{include: [
              $platforms[] as $platform | ($platform | split("/")[1]) as $arch
              | {platform: $platform, arch: $arch,
                 runner: (if $arch == "arm64" then "ubuntu-24.04-arm" else "ubuntu-latest" end)}
            ]}'
          }
          {
            echo "publish=$publish"
            echo "branch=$BRANCH"
            echo "tag=${BRANCH}-${SHA::7}"
            echo "environment=$environment"
            echo "deploy_ref=$deploy_ref"
            echo "cms_api_matrix=$(matrix_for "$CMS_API_IMAGE")"
            echo "cms_admin_matrix=$(matrix_for "$CMS_ADMIN_IMAGE")"
            echo "web_matrix=$(matrix_for "$WEB_IMAGE")"
            echo "turbo_version=$TURBO_VERSION"
            echo "image_prefix=$IMAGE_PREFIX"
          } >> "$GITHUB_OUTPUT"
          echo "Target: $BRANCH, publish=$publish, platforms $platforms, environment '${environment}'"

  # Repo-wide checks that no single app owns
  repo:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  # Status checks show as "<app> / Checks" and "<app> / Build"
  cms-api:
    name: cms-api
    needs: changes
    if: needs.changes.outputs.cms_api_affected == 'true'
    uses: ./.github/workflows/cms-api.yml
    with:
      turbo_version: ${{ needs.changes.outputs.turbo_version }}

  cms-admin:
    name: cms-admin
    needs: changes
    if: needs.changes.outputs.cms_admin_affected == 'true'
    uses: ./.github/workflows/cms-admin.yml
    with:
      turbo_version: ${{ needs.changes.outputs.turbo_version }}

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web_affected == 'true'
    uses: ./.github/workflows/web.yml
    with:
      turbo_version: ${{ needs.changes.outputs.turbo_version }}

  # Status check shows as "e2e / Playwright"
  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
    with:
      turbo_version: ${{ needs.changes.outputs.turbo_version }}

  publish-cms-api:
    name: publish cms-api
    needs: [changes, cms-api, e2e]
    # always(): run even though a sibling app flow failed or was skipped; only this app and e2e must be green
    if: >-
      always() && needs.changes.outputs.publish == 'true' && needs.changes.outputs.cms_api_image == 'true'
      && needs.cms-api.result == 'success' && needs.e2e.result == 'success'
    uses: ./.github/workflows/_publish.yml
    # Called workflow's jobs get at most these; only its image and manifest jobs use packages: write
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      app: cms-api
      environment: ${{ needs.changes.outputs.environment }}
      matrix: ${{ needs.changes.outputs.cms_api_matrix }}
      tag: ${{ needs.changes.outputs.tag }}
      branch: ${{ needs.changes.outputs.branch }}
      deploy_ref: ${{ needs.changes.outputs.deploy_ref }}
      image_prefix: ${{ needs.changes.outputs.image_prefix }}
      turbo_version: ${{ needs.changes.outputs.turbo_version }}

  publish-cms-admin:
    name: publish cms-admin
    needs: [changes, cms-admin, e2e]
    # always(): run even though a sibling app flow failed or was skipped; only this app and e2e must be green
    if: >-
      always() && needs.changes.outputs.publish == 'true' && needs.changes.outputs.cms_admin_image == 'true'
      && needs.cms-admin.result == 'success' && needs.e2e.result == 'success'
    uses: ./.github/workflows/_publish.yml
    # Called workflow's jobs get at most these; only its image and manifest jobs use packages: write
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      app: cms-admin
      environment: ${{ needs.changes.outputs.environment }}
      matrix: ${{ needs.changes.outputs.cms_admin_matrix }}
      tag: ${{ needs.changes.outputs.tag }}
      branch: ${{ needs.changes.outputs.branch }}
      deploy_ref: ${{ needs.changes.outputs.deploy_ref }}
      image_prefix: ${{ needs.changes.outputs.image_prefix }}
      turbo_version: ${{ needs.changes.outputs.turbo_version }}

  publish-web:
    name: publish web
    needs: [changes, web, e2e]
    # always(): run even though a sibling app flow failed or was skipped; only this app and e2e must be green
    if: >-
      always() && needs.changes.outputs.publish == 'true' && needs.changes.outputs.web_image == 'true'
      && needs.web.result == 'success' && needs.e2e.result == 'success'
    uses: ./.github/workflows/_publish.yml
    # Called workflow's jobs get at most these; only its image and manifest jobs use packages: write
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      app: web
      environment: ${{ needs.changes.outputs.environment }}
      matrix: ${{ needs.changes.outputs.web_matrix }}
      tag: ${{ needs.changes.outputs.tag }}
      branch: ${{ needs.changes.outputs.branch }}
      deploy_ref: ${{ needs.changes.outputs.deploy_ref }}
      image_prefix: ${{ needs.changes.outputs.image_prefix }}
      turbo_version: ${{ needs.changes.outputs.turbo_version }}
