# Docs: docs/ci-cd.md (e2e in CI)
# Playwright (apps/e2e) against the built per-service images, started with plain
# `docker run` by scripts/e2e-stack.sh (Traefik in front, cms-api init container
# first). Plain docker only. Called by ci.yml when any app or the e2e suite changed.
# Status check shows as "e2e / Playwright".
name: e2e

on:
  workflow_call:
    inputs:
      turbo_version:
        description: turbo version, kept in sync with the Dockerfiles and the root package.json
        type: string
        required: true

# Read-only: nothing is pushed, no secrets are used
permissions:
  contents: read

env:
  TURBO_VERSION: ${{ inputs.turbo_version }}
  # Must match the defaults of scripts/e2e-stack.sh (E2E_DOMAIN, E2E_HTTP_PORT):
  # the admin image bakes the API origin in at build time.
  E2E_DOMAIN: domain.localhost
  E2E_HTTP_PORT: '8080'

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Node (Playwright's request client) resolves the *.localhost hosts through the system resolver
      - name: Map the stack hosts to loopback
        run: echo "127.0.0.1 ${E2E_DOMAIN} admin.${E2E_DOMAIN} mail.${E2E_DOMAIN}" | sudo tee -a /etc/hosts

      # Web build args (API path, Turnstile test site key) live in one file shared with e2e-stack.sh
      - name: Read the web build args
        id: web_args
        run: |
          {
            echo 'args<<EOF'
            grep -Ev '^(#|$)' scripts/stack/web-build.env
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build cms-api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/cms-api/Dockerfile
          build-args: TURBO_VERSION=${{ env.TURBO_VERSION }}
          load: true
          tags: abyss-e2e-cms-api:ci
          cache-from: type=gha,scope=e2e-cms-api
          cache-to: type=gha,mode=max,scope=e2e-cms-api

      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            TURBO_VERSION=${{ env.TURBO_VERSION }}
            ${{ steps.web_args.outputs.args }}
          load: true
          tags: abyss-e2e-web:ci
          cache-from: type=gha,scope=e2e-web
          cache-to: type=gha,mode=max,scope=e2e-web

      - name: Build cms-admin image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/cms-admin/Dockerfile
          build-args: |
            TURBO_VERSION=${{ env.TURBO_VERSION }}
            VITE_API_BASE_URL=http://${{ env.E2E_DOMAIN }}:${{ env.E2E_HTTP_PORT }}/api/v1
          load: true
          tags: abyss-e2e-cms-admin:ci
          cache-from: type=gha,scope=e2e-cms-admin
          cache-to: type=gha,mode=max,scope=e2e-cms-admin

      - name: Install Chromium
        run: pnpm --filter @abyss/e2e exec playwright install --with-deps chromium

      - name: Run the e2e stack and the suite
        env:
          E2E_NO_BUILD: '1'
          E2E_IMAGE_CMS_API: abyss-e2e-cms-api:ci
          E2E_IMAGE_WEB: abyss-e2e-web:ci
          E2E_IMAGE_CMS_ADMIN: abyss-e2e-cms-admin:ci
        run: bash scripts/e2e-stack.sh

      # Includes apps/e2e/test-results/stack-logs (docker logs of every container)
      - name: Upload the report and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
