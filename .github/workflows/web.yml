# Docs: docs/ci-cd.md
# web flow, called by ci.yml when web is affected: checks -> build
# Publishing is added by T37e (docs/ci-cd.md); no image is built here.
# Status checks show as "web / Checks" and "web / Build".
name: web

on:
  workflow_call:
    inputs:
      turbo_version:
        description: turbo version, kept in sync with the Dockerfiles and the root package.json
        type: string
        required: true

# Read-only: checks and build push nothing
permissions:
  contents: read

env:
  TURBO_VERSION: ${{ inputs.turbo_version }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and lint
        run: pnpm turbo run typecheck lint --filter=@abyss/web
      - name: Unit tests
        run: pnpm --filter @abyss/web test

  build:
    name: Build
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm turbo run build --filter=@abyss/web
