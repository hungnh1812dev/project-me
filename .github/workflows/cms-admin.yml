# Docs: docs/ci-cd.md
# cms-admin flow, called by ci.yml when cms-admin is affected: checks -> build
# This flow builds no image; publishing runs from ci.yml through _publish.yml (docs/ci-cd.md).
# Status checks show as "cms-admin / Checks" and "cms-admin / Build".
name: cms-admin

on:
  workflow_call:
    inputs:
      turbo_version:
        description: turbo version, kept in sync with the Dockerfiles and the root package.json
        type: string
        required: true

# Read-only: checks and build push nothing
permissions:
  contents: read

env:
  TURBO_VERSION: ${{ inputs.turbo_version }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and lint
        run: pnpm turbo run typecheck lint --filter=@abyss/cms-admin
      - name: Unit tests
        run: pnpm --filter @abyss/cms-admin test

  build:
    name: Build
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm turbo run build --filter=@abyss/cms-admin
