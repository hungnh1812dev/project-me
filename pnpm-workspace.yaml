packages:
  - 'apps/*'
  - 'packages/*'

# Dependency install scripts are off unless listed as true here.
# None of these are needed: each ships prebuilt/pure-JS fallbacks.
allowBuilds:
  '@parcel/watcher': false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false
