packages:
  - 'apps/*'
  - 'packages/*'

# Dependency install scripts are off unless listed as true here.
# The false ones are not needed: each ships prebuilt/pure-JS fallbacks
# (argon2 ships glibc + musl prebuilds). True: @prisma/engines downloads the
# schema engine used by `prisma migrate`; prisma only checks the Node version.
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  argon2: false
  cpu-features: false
  esbuild: false
  prisma: true
  protobufjs: false
  ssh2: false
  unrs-resolver: false

# GHSA-q7qp-rjg7-q26m (multer DoS, fixed in 2.5.0): @nestjs/platform-express
# pins multer 2.4.0 exactly. Drop this when a Nest release pins >= 2.5.0.
overrides:
  multer: 2.5.0
