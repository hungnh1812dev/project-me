# Proxy smoke stack (T04). Mirrors production routing (SPEC §1, §6):
#   <SMOKE_DOMAIN>          -> web, and /api/* -> cms-api (no StripPrefix)
#   admin.<SMOKE_DOMAIN>    -> cms-admin
#   mail.<SMOKE_DOMAIN>     -> Mailpit web UI + API (T12; catches every email)
# Run it through `pnpm smoke` (scripts/smoke.sh), which sets every SMOKE_* value
# below, generates throwaway secrets, runs the assertions and tears down.
name: abyss-smoke

services:
  proxy:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --ping=true
    ports:
      - '${SMOKE_HTTP_PORT:?set by scripts/smoke.sh}:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 2s
      timeout: 3s
      retries: 15

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abyss
      POSTGRES_DB: abyss
      POSTGRES_PASSWORD: ${SMOKE_DB_PASSWORD:?set by scripts/smoke.sh}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U abyss -d abyss']
      interval: 2s
      timeout: 3s
      retries: 15

  # SMTP sink for OTP emails (T12): SMTP on 1025 without auth or TLS; the e2e
  # suite reads codes from its API on 8025.
  mailpit:
    image: axllent/mailpit:v1.31.6
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 15
    labels:
      traefik.enable: 'true'
      traefik.http.routers.mail.entrypoints: web
      traefik.http.routers.mail.rule: Host(`mail.${SMOKE_DOMAIN}`)
      traefik.http.services.mail.loadbalancer.server.port: '8025'

  cms-api:
    image: abyss-smoke-cms-api
    build:
      context: .
      dockerfile: apps/cms-api/Dockerfile
    # Static settings: scripts/stack/cms-api.env (shared with the CI e2e stack).
    env_file: &cms-api-env-file
      - scripts/stack/cms-api.env
    environment: &cms-api-env
      DB_PASSWORD: ${SMOKE_DB_PASSWORD}
      ADMIN_ORIGIN: ${SMOKE_ADMIN_ORIGIN:?set by scripts/smoke.sh}
      WEB_ORIGIN: ${SMOKE_WEB_ORIGIN:?set by scripts/smoke.sh}
      MAIL_FROM: Abyss Smoke <no-reply@${SMOKE_DOMAIN}>
      JWT_ACCESS_SECRET: ${SMOKE_JWT_ACCESS_SECRET:?set by scripts/smoke.sh}
      JWT_ACCESS_KID: ${SMOKE_JWT_ACCESS_KID:?set by scripts/smoke.sh}
      OTP_PEPPER: ${SMOKE_OTP_PEPPER:?set by scripts/smoke.sh}
      TOTP_ENC_KEY: ${SMOKE_TOTP_ENC_KEY:?set by scripts/smoke.sh}
      TOTP_ENC_KID: ${SMOKE_TOTP_ENC_KID:?set by scripts/smoke.sh}
    depends_on:
      cms-api-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/v1/health/ready']
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      traefik.enable: 'true'
      traefik.http.routers.api.entrypoints: web
      traefik.http.routers.api.rule: Host(`${SMOKE_DOMAIN:?set by scripts/smoke.sh}`) && PathPrefix(`/api`)
      traefik.http.services.api.loadbalancer.server.port: '3000'

  # T37a: init container. Same image and env as cms-api, different command:
  # applies committed core + content migrations, then exits. cms-api starts only
  # after it exits 0. Never runs content:generate or owner:bootstrap.
  cms-api-init:
    image: abyss-smoke-cms-api
    build:
      context: .
      dockerfile: apps/cms-api/Dockerfile
    command: ['npm', 'run', '--silent', 'deploy:migrate']
    env_file: *cms-api-env-file
    environment: *cms-api-env
    depends_on:
      db:
        condition: service_healthy

  # T30b: Next.js standalone server (T30a). Server env is read at run time;
  # NEXT_PUBLIC_API_BASE_URL is baked into the browser bundle at build time.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        # T32: Cloudflare's public always-pass Turnstile test site key (smoke
        # build only; production builds use the real key).
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    environment:
      API_INTERNAL_URL: http://cms-api:3000/api/v1
      # Smoke runs with no data cache (Q-W3); production uses 60.
      WEB_REVALIDATE_SECONDS: '0'
      WEB_PORT: ${WEB_PORT:-8080}
    depends_on:
      cms-api:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q -O /dev/null "http://127.0.0.1:$${WEB_PORT}/"']
      interval: 2s
      timeout: 3s
      retries: 30
    # The /api router (cms-api) has the longer rule, so it wins over this
    # catch-all by Traefik's default rule-length priority; no StripPrefix.
    labels:
      traefik.enable: 'true'
      traefik.http.routers.web.entrypoints: web
      traefik.http.routers.web.rule: Host(`${SMOKE_DOMAIN}`)
      traefik.http.services.web.loadbalancer.server.port: ${WEB_PORT:-8080}

  cms-admin:
    build:
      context: .
      dockerfile: apps/cms-admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${SMOKE_API_BASE_URL:?set by scripts/smoke.sh}
    labels:
      traefik.enable: 'true'
      traefik.http.routers.admin.entrypoints: web
      traefik.http.routers.admin.rule: Host(`admin.${SMOKE_DOMAIN}`)
      traefik.http.services.admin.loadbalancer.server.port: '8080'
